<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>Saathi Help Remote — ESP32 wiring diagram</title>
  <rect width="1160" height="760" fill="#ffffff"/>
  <text x="580" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1c2333">Saathi Help Remote — ESP32 Wiring Diagram</text>
  <text x="580" y="56" text-anchor="middle" font-size="13" fill="#555">Buttons use internal pull-ups (pressed = GPIO to GND). All grounds are common.</text>

  <!-- ESP32 -->
  <rect x="460" y="100" width="240" height="430" rx="10" fill="#1f4e79"/>
  <text x="580" y="135" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">ESP32 DevKit V1</text>
  <text x="580" y="155" text-anchor="middle" font-size="12" fill="#cfe0f3">Wi-Fi → POST /api/device/button</text>
  <g fill="#fff" font-size="13">
    <text x="472" y="205">GPIO32</text><text x="472" y="265">GPIO33</text><text x="472" y="325">GPIO25</text><text x="472" y="385">GPIO26</text><text x="472" y="465">GND</text>
    <text x="688" y="205" text-anchor="end">GPIO2</text><text x="688" y="265" text-anchor="end">GPIO4</text><text x="688" y="325" text-anchor="end">GPIO27</text><text x="688" y="385" text-anchor="end">3V3</text><text x="688" y="465" text-anchor="end">GND</text>
    <text x="688" y="505" text-anchor="end">VIN (5V)</text>
  </g>
  <g fill="#ffd400"><circle cx="460" cy="200" r="5"/><circle cx="460" cy="260" r="5"/><circle cx="460" cy="320" r="5"/><circle cx="460" cy="380" r="5"/><circle cx="460" cy="460" r="5"/>
    <circle cx="700" cy="200" r="5"/><circle cx="700" cy="260" r="5"/><circle cx="700" cy="320" r="5"/><circle cx="700" cy="380" r="5"/><circle cx="700" cy="460" r="5"/><circle cx="700" cy="500" r="5"/></g>

  <!-- GND bus left -->
  <line x1="70" y1="200" x2="70" y2="460" stroke="#000" stroke-width="3"/>
  <line x1="70" y1="460" x2="455" y2="460" stroke="#000" stroke-width="3"/>
  <text x="76" y="480" font-size="12">GND bus</text>

  <!-- buttons -->
  <g stroke-width="3" fill="none">
    <line x1="455" y1="200" x2="300" y2="200" stroke="#2563eb"/><line x1="200" y1="200" x2="70" y2="200" stroke="#000"/>
    <line x1="455" y1="260" x2="300" y2="260" stroke="#1a7f37"/><line x1="200" y1="260" x2="70" y2="260" stroke="#000"/>
    <line x1="455" y1="320" x2="300" y2="320" stroke="#b42318"/><line x1="200" y1="320" x2="70" y2="320" stroke="#000"/>
    <line x1="455" y1="380" x2="300" y2="380" stroke="#e8590c"/><line x1="200" y1="380" x2="70" y2="380" stroke="#000"/>
  </g>
  <g>
    <rect x="200" y="182" width="100" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="250" y="205" text-anchor="middle" font-weight="bold">🎤 SPEAK</text>
    <rect x="200" y="242" width="100" height="36" rx="8" fill="#dcfce7" stroke="#1a7f37" stroke-width="2"/><text x="250" y="265" text-anchor="middle" font-weight="bold">✔ YES</text>
    <rect x="200" y="302" width="100" height="36" rx="8" fill="#fee2e2" stroke="#b42318" stroke-width="2"/><text x="250" y="325" text-anchor="middle" font-weight="bold">✖ NO</text>
    <rect x="200" y="362" width="100" height="36" rx="8" fill="#ffedd5" stroke="#e8590c" stroke-width="2"/><text x="250" y="385" text-anchor="middle" font-weight="bold">🆘 SOS</text>
  </g>
  <text x="250" y="168" text-anchor="middle" font-size="12" fill="#555">30 mm arcade push buttons</text>

  <!-- GND bus right -->
  <line x1="1110" y1="200" x2="1110" y2="460" stroke="#000" stroke-width="3"/>
  <line x1="705" y1="460" x2="1110" y2="460" stroke="#000" stroke-width="3"/>

  <!-- green LED -->
  <line x1="705" y1="200" x2="780" y2="200" stroke="#1a7f37" stroke-width="3"/>
  <rect x="780" y="190" width="70" height="20" fill="#f5f0e1" stroke="#000" stroke-width="2"/><text x="815" y="186" text-anchor="middle" font-size="12">220 Ω</text>
  <line x1="850" y1="200" x2="920" y2="200" stroke="#1a7f37" stroke-width="3"/>
  <polygon points="920,186 920,214 948,200" fill="#22c55e" stroke="#000" stroke-width="2"/><line x1="948" y1="186" x2="948" y2="214" stroke="#000" stroke-width="2"/>
  <text x="934" y="180" text-anchor="middle" font-size="12">Green LED (OK)</text>
  <line x1="948" y1="200" x2="1110" y2="200" stroke="#000" stroke-width="3"/>

  <!-- red LED -->
  <line x1="705" y1="260" x2="780" y2="260" stroke="#b42318" stroke-width="3"/>
  <rect x="780" y="250" width="70" height="20" fill="#f5f0e1" stroke="#000" stroke-width="2"/><text x="815" y="246" text-anchor="middle" font-size="12">220 Ω</text>
  <line x1="850" y1="260" x2="920" y2="260" stroke="#b42318" stroke-width="3"/>
  <polygon points="920,246 920,274 948,260" fill="#ef4444" stroke="#000" stroke-width="2"/><line x1="948" y1="246" x2="948" y2="274" stroke="#000" stroke-width="2"/>
  <text x="934" y="240" text-anchor="middle" font-size="12">Red LED (error)</text>
  <line x1="948" y1="260" x2="1110" y2="260" stroke="#000" stroke-width="3"/>

  <!-- vibration motor driver -->
  <line x1="705" y1="320" x2="760" y2="320" stroke="#7c3aed" stroke-width="3"/>
  <rect x="760" y="310" width="60" height="20" fill="#f5f0e1" stroke="#000" stroke-width="2"/><text x="790" y="306" text-anchor="middle" font-size="12">1 kΩ</text>
  <line x1="820" y1="320" x2="880" y2="320" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="905" cy="320" r="26" fill="#fff" stroke="#000" stroke-width="2"/>
  <line x1="890" y1="305" x2="890" y2="335" stroke="#000" stroke-width="3"/>
  <line x1="880" y1="320" x2="890" y2="320" stroke="#000" stroke-width="2"/>
  <line x1="890" y1="312" x2="912" y2="298" stroke="#000" stroke-width="2"/><line x1="890" y1="328" x2="912" y2="342" stroke="#000" stroke-width="2"/>
  <text x="905" y="364" text-anchor="middle" font-size="12">NPN 2N2222 / BC547</text>
  <text x="940" y="300" font-size="11">C</text><text x="940" y="348" font-size="11">E</text><text x="866" y="314" font-size="11">B</text>
  <!-- emitter to GND -->
  <line x1="912" y1="342" x2="912" y2="420" stroke="#000" stroke-width="3"/><line x1="912" y1="420" x2="1110" y2="420" stroke="#000" stroke-width="3"/>
  <!-- collector to motor -->
  <line x1="912" y1="298" x2="1000" y2="298" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="1030" cy="330" r="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1030" y="335" text-anchor="middle" font-weight="bold">M</text>
  <line x1="1000" y1="298" x2="1012" y2="312" stroke="#7c3aed" stroke-width="3"/>
  <line x1="1048" y1="348" x2="1060" y2="380" stroke="#c2410c" stroke-width="3"/>
  <line x1="705" y1="380" x2="1060" y2="380" stroke="#c2410c" stroke-width="3" stroke-dasharray="0"/>
  <text x="1030" y="370" text-anchor="middle" font-size="12">Vibration motor 3V</text>
  <text x="740" y="398" font-size="12" fill="#c2410c">3V3 → motor (+)</text>
  <text x="720" y="445" font-size="11" fill="#555">1N4148 diode across motor (stripe to 3V3)</text>

  <!-- power section -->
  <rect x="80" y="590" width="150" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="155" y="625" text-anchor="middle" font-weight="bold">18650 Li-ion</text><text x="155" y="645" text-anchor="middle" font-size="12">3.7 V, 2000+ mAh</text>
  <rect x="300" y="590" width="170" height="80" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="385" y="622" text-anchor="middle" font-weight="bold">TP4056 charger</text><text x="385" y="642" text-anchor="middle" font-size="11">USB-C charging input</text><text x="385" y="657" text-anchor="middle" font-size="11">B+/B− to cell · OUT to switch</text>
  <rect x="540" y="600" width="90" height="60" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="585" y="628" text-anchor="middle" font-weight="bold">Switch</text><text x="585" y="646" text-anchor="middle" font-size="12">ON / OFF</text>
  <rect x="700" y="590" width="170" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="785" y="622" text-anchor="middle" font-weight="bold">MT3608 boost</text><text x="785" y="642" text-anchor="middle" font-size="12">set output to 5.0 V</text>
  <g stroke="#dc2626" stroke-width="3" fill="none">
    <line x1="230" y1="615" x2="300" y2="615"/><line x1="470" y1="615" x2="540" y2="615"/><line x1="630" y1="615" x2="700" y2="615"/>
    <polyline points="870,615 940,615 940,500 705,500"/>
  </g>
  <g stroke="#000" stroke-width="3" fill="none">
    <line x1="230" y1="650" x2="300" y2="650"/><polyline points="470,650 500,650 500,690 900,690 900,650 870,650"/>
    <polyline points="900,690 1110,690 1110,460"/>
  </g>
  <text x="944" y="560" font-size="12" fill="#dc2626">+5 V → VIN</text>
  <text x="990" y="710" font-size="12">GND (common)</text>
  <text x="265" y="608" text-anchor="middle" font-size="11" fill="#dc2626">B+</text><text x="265" y="666" text-anchor="middle" font-size="11">B−</text>

  <rect x="20" y="715" width="1120" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="580" y="738" text-anchor="middle" font-size="13" fill="#334155">For bench demos you can skip the battery section and power the ESP32 from its USB port.</text>
</svg>
